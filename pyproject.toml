[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-time-per-card"
version = "0.1.0"
description = "Local Anki add-on for today's average review time per card."
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [
  ".git",
  ".codegraph",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["addon", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true

[tool.bandit]
skips = ["B101"]

[tool.deptry]

[tool.deptry.per_rule_ignores]
DEP001 = ["anki", "aqt"]
DEP002 = ["setuptools"]
DEP003 = ["anki", "aqt", "argcomplete"]
